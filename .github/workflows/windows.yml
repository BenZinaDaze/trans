name: Windows x64 package

on:
  push:
    branches: ['**']
    tags: ['v*', 'windows-test-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: MSVC / Qt 6.8.3 x64
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch '\bproject\s*\(\s*trans\s+VERSION\s+(\d+\.\d+\.\d+)\s') { throw 'Missing version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v') -and $env:GITHUB_REF_NAME -ne "v$($Matches[1])") {
            throw 'Release tag must match CMake version'
          }
      - name: Install pinned Qt SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt" --archives qtbase qtdeclarative qtsvg qttools
          $qt = "$env:RUNNER_TEMP/Qt/$env:QT_VERSION/msvc2022_64"
          "QT_ROOT=$qt" >> $env:GITHUB_ENV
          "$qt/bin" >> $env:GITHUB_PATH
      - name: Build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build-windows -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT" "-DCMAKE_INSTALL_BINDIR=." -DBUILD_TESTING=ON
          cmake --build build-windows --config Release --parallel 4
          cmake --build build-windows --config Release --target trans_qmllint
          try {
            ctest --test-dir build-windows -C Release --output-on-failure
          } finally {
            Get-ChildItem build-windows/*-test.txt | ForEach-Object {
              Write-Output "::group::$($_.Name)"
              Get-Content $_.FullName
              Write-Output '::endgroup::'
            }
          }
      - name: Deploy, smoke and package
        shell: pwsh
        run: ./packaging/deploy-windows.ps1 -BuildDir build-windows -QtRoot "$env:QT_ROOT" -QtVersion "$env:QT_VERSION" -OutputDir "$env:RUNNER_TEMP/trans-windows"
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trans-windows-x64
          path: |
            ${{ runner.temp }}/trans-windows/*.zip
            ${{ runner.temp }}/trans-windows/SHA256SUMS-windows-x64
            ${{ runner.temp }}/trans-windows/windows-settings-preview.png
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Windows assets
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: trans-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trans-windows-x64
          path: packages
      - name: Upload Windows release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd packages
          sha256sum --check SHA256SUMS-windows-x64
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Trans $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS-windows-x64 --clobber
