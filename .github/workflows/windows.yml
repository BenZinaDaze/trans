name: Windows x64 package

on:
  push:
    branches: ['**']
    tags: ['v*', 'windows-test-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: MSVC / Slint 1.18.1 x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RUST_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      VCPKG_COMMIT: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
      SLINT_NO_QT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch '\bproject\s*\(\s*trans\s+VERSION\s+(\d+\.\d+\.\d+)\s') { throw 'Missing version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v') -and $env:GITHUB_REF_NAME -ne "v$($Matches[1])") {
            throw 'Release tag must match CMake version'
          }
      - name: Check out pinned native dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }} # 2026.07.29
          path: .deps/vcpkg
          persist-credentials: false
      - name: Install pinned Rust and native dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          rustup default $env:RUST_TOOLCHAIN
          & ./.deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          & ./.deps/vcpkg/vcpkg.exe install 'curl[core,ssl,http2,winidn]:x64-windows' 'libpng:x64-windows' 'nlohmann-json:x64-windows' --clean-after-build
      - name: Build and test native applications
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE '.deps/vcpkg'
          cmake -S . -B build-windows -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=x64-windows" "-DRust_TOOLCHAIN=$env:RUST_TOOLCHAIN" "-DCMAKE_INSTALL_BINDIR=." "-DCMAKE_INSTALL_LIBDIR=." -DBUILD_TESTING=ON
          cmake --build build-windows --config Release --parallel 2
          # The driver shares the production networking DLLs; keep their directory
          # on PATH for the real local-HTTP business regression, not for packaging.
          $env:PATH = "$vcpkg/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build-windows -C Release --output-on-failure --no-tests=error
      - name: Deploy, smoke and package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./packaging/deploy-windows.ps1 -BuildDir build-windows -DependenciesRoot .deps/vcpkg/installed/x64-windows -RustToolchain "$env:RUST_TOOLCHAIN" -OutputDir "$env:RUNNER_TEMP/trans-windows"
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trans-windows-x64
          path: |
            ${{ runner.temp }}/trans-windows/*.zip
            ${{ runner.temp }}/trans-windows/SHA256SUMS-windows-x64
            ${{ runner.temp }}/trans-windows/windows-runtime-files.csv
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Windows assets
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: trans-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trans-windows-x64
          path: packages
      - name: Upload Windows release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd packages
          sha256sum --check SHA256SUMS-windows-x64
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Trans $RELEASE_TAG" --generate-notes \
              --notes '![Made with Slint](https://raw.githubusercontent.com/slint-ui/slint/v1.18.1/logo/MadeWithSlint-logo-whitebg.png)'
          fi
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS-windows-x64 --clobber
